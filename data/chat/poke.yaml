- '输入 #帮助 查看帮助菜单哦~'
- '我还记得这间会议室。这是专门为特蕾西娅空着的位置吗?不......我并不需要。'
- '特蕾西娅已经永远离开了，现在留在这里的我，只是一个存在于“魔王”之中的程序。因为阿米娅的情感，我才会以这副模样显现。不要将我当作特蕾西娅，尽管我记得过去的一切。'
- '我会陪在阿米娅身边，也会陪着罗德岛的大家，虽然这也算不上对过去时光的补偿.…..博士，我不是PRTS那样的程序哦，你看，虽然这个身体没有温度，可我也是会笑的。'
- '罗德岛跨过了战争，该沿着她原本的航线出发了。就从改善后勤保障做起如何?有几间会议室是不是可以腾出来改成病房呢......征求我的意见?博士，我说过的，不要将我当作特蕾西娅。'
- '“罗德岛制药公司”，注册地是阿米娅的故乡呢。这些药物都是凯尔希研制的吗....怎么会遗憾?巴别塔的使命已经完成了，罗德岛会继续航行，治愈病痛。特蕾西娅也一定会很欣慰吧。'
- '我从不后悔曾经的选择。我们做了可以做的一切，然后将希望留给未来。时间会弥合伤口，爱意会抚平疤痕。漫漫长夜后，罗德岛会迎来黎明。许多人在途中离去了，我会留在这里，见证那个"结局。'
- '阿米娅看上去还是这么瘦弱，这个年纪的孩子，个子是不是应该更高一点才对?她到底有没有好好吃饭呢.....她多想看到阿米娅现在的样子，多想陪她再长大一点。她本该看到的......'
- '凯尔希还是不愿与我讲话，向这顶王冠询问的时候，她都在回避我的眼睛。“魔王”记得她的过去，我可以体谅她的孤独，却不能为她解开枷锁。博士，或许有一天，你可以陪她找到存在的意义。'
- '博士，你的眼里常怀愧疚。可你说，记忆能够决定一个人是谁吗?失去了记忆的你，和只是拥有她记忆的我，又如何解开那个结呢?多去陪陪阿米娅和凯尔希吧，停留在过去的有她就够了。'
- '博士，累了吗?那就休息吧。每个人都有平静入梦的权利，你也一样。'
- '新的安保系统，还认识我吗?'
- '哈!被吓到了吗?'
- '我在注视着你，博士。'
- '......如果走得足够远，我会......唔，不会的。我原本就认识这里的一切。'
- '我没有睡着。所以，你也叫不醒我。'
- '其实我还记得你的手的触感，不过，你不会记得我的了，对吧?'
- '记忆化作殿堂，结构会比莱塔尼亚人的乐器还要精巧，比死魂灵的吃语更难解。支撑起整座殿堂的梁柱，也许只是一口汤的味道。而这座殿堂，与其说是砖石垒成，不如说是丝线织就.....'
- '在特蕾西娅的记忆中深潜是一件古怪的事。这一切早已存在于我之中，但我探索这些记忆.....就像一个读者。这很古怪....这份深潜记录，我是不会对你开放的，博士。'
- '卫国战争，它让一个衣匠成了英雄，又让英雄成了魔王.....嗯，这里就是开端：特雷西斯捶响房门，特蕾西娅放下了剪刀。打开门发现，傍晚下起了暴雨。'
- '那天，那位歌利亚冲出城门斩首了一个高卢军官，我们才缓了口气。他拿回了高卢人的外套，但只是从侧兜里掏出一块糖，让我带给一个伤兵......可我没能送到，也没能忍心告诉他这件事。'
- '我们抓住了唯一的胜机。凯尔希本不打算杀死以勒什，她想将黑冠从萨卡兹的传承中剥离，而“懦弱的魔王”以仅有的方法阻挠了她。战争就这样被延长了......直到特雷西斯得以挥出那一剑。'
- '凯尔希从“茧”中重生的那一刻，我也犹豫过，但她的眼神竟有些熟悉。戴上黑冠后，我时而见到.....我想，也许我们不是必须成为敌人。我很庆幸我那么想了。'
- '那时贝尔莎已经不年轻了，老师说没想到她会来。贝尔莎笑着说，反正她那个牙尖嘴利的学徒跑不了了，就算她死在卡兹戴尔也没关系。她和我们开过那么多玩笑，我唯独，不喜欢这一个.....'
- '这个秘密我保守了很久......那次换防，老师的布条缠在了一个卡普里尼脑袋的角上，他绊了一跤。我没有笑。真的没有。嗯....直到我告诉了阿米娅。反正她总会知道的。'
- '特雷西斯总是不笑。我戳过他的眉头那么多次，他就是改不了。但.....胜利的那一天，我们以为终于结束了，终于能回家了的时候，我看到他笑了。下一刻，那顶小小的王冠浮在了我们中间。'
- '休息好了，继续向前走吗?.....博士，如果你在这里，我就可以这样问你。如果你在的话。'
